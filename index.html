<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badrola - Link in Bio</title>
    <style>
        body {
            background: linear-gradient(135deg, #2b0948, #4a1578, #1a052e);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .profile-container {
            text-align: center;
            margin-top: 30px;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #b19cd9;
            box-shadow: 0 0 20px rgba(177, 156, 217, 0.5);
            margin-bottom: 15px;
        }
        h1 {
            font-size: 28px;
            margin: 10px 0 5px;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #d1c4e9;
            font-size: 15px;
            margin-bottom: 20px;
        }
        /* شارة متابعين كيك مع الاسم */
        .kick-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(83, 252, 24, 0.15);
            border: 1px solid #53fc18;
            color: #53fc18;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(83, 252, 24, 0.25);
        }
        .links-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-btn {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .link-btn img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-left: 15px;
            border: 1px solid #b19cd9;
        }
        .link-btn:hover {
            background: rgba(177, 156, 217, 0.25);
            border-color: #b19cd9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- شارة كيك مضاف إليها الاسم -->
        <div class="kick-badge">
            <span>🟢 الاخضر القحطاني - 33 ألف متابع على Kick</span>
        </div>

        <!-- صورتك الشخصية -->
        <img src="1000048956.jpg" alt="Badrola" class="profile-img">
        <h1>Badrola</h1>
        <p class="subtitle">تابعني على جميع المنصات الرسمية</p>
    </div>

    <div class="links-container">
        <!-- أزرار اللينكات مع صورتك الشخصية بجانب كل زر -->
        <a href="https://youtube.com" class="link-btn" target="_blank">
            <img src="1000048956.jpg" alt="icon">
            <span>قناة اليوتيوب (YouTube)</span>
        </a>

        <a href="https://tiktok.com" class="link-btn" target="_blank">
            <img src="1000048956.jpg" alt="icon">
            <span>حساب التيك توك (TikTok)</span>
        </a>

        <a href="https://discord.com" class="link-btn" target="_blank">
            <img src="1000048956.jpg" alt="icon">
            <span>سيرفر الديسكورد (Discord)</span>
        </a>

        <a href="https://whatsapp.com" class="link-btn" target="_blank">
            <img src="1000048956.jpg" alt="icon">
            <span>قناة الواتساب (WhatsApp)</span>
        </a>
    </div>

</body>
  </html>
